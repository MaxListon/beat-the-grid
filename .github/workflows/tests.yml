name: Tests

# Runs the test suite on every push and pull request. Deprecation warnings count as failures,
# so a library change that would break the daily job shows up here first.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -W error::DeprecationWarning
