name: Tests

# Runs the test suite on every push and pull request. Deprecation warnings count as failures,
# so a library change that would break the daily job shows up here first.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.8.6
      - name: Lint (ruff)
        run: ruff check .
      - run: python -m pytest -q -W error::DeprecationWarning

  website:
    # ESLint for the site's JavaScript, then browser tests that drive real Chrome against the site:
    # navigation, explorer, game, SQL console, 404 page and feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Browser tests
        run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
